name: Core Foundation V2 Migration

on:
  push:
    branches:
      - chatgpt/core-foundation-v2

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize stale shared comments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Leviathan/Content/Scripts/LeviathanCombat.cs')
          t = p.read_text(encoding='utf-8-sig')
          t = t.replace('player / Leviathan owner', 'player / class owner')
          t = t.replace('claimed Leviathan local transaction', 'claimed local authored transaction')
          t = t.replace('other Leviathan skills owned by the same player', 'other semantic skills owned by the same player')
          p.write_text(t, encoding='utf-8')
          PY

      - name: Run Core foundation migration
        run: python3 tools/core_foundation_migrate_v2.py

      - name: Commit migrated foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Promote shared foundation to Core v2"
          git push origin HEAD:chatgpt/core-foundation-v2

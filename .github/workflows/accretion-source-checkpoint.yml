# Temporary, branch-only materialization of checksum-verified source edits.
# The payload contains JSON line edits, never executable serialization or game DLLs.
name: Accretion source checkpoint
on:
  push:
    branches: [codex/orrery-accretion-coop]
    paths: ['.github/workflows/accretion-source-checkpoint.yml']
permissions:
  contents: write
concurrency:
  group: accretion-source-checkpoint
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'yropro/My-project' && github.ref == 'refs/heads/codex/orrery-accretion-coop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          lfs: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Verify all source preimages and exact tested postimages
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          assert subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip() == '4e899ad5c45430e70c0fb121e09b501aa385749d'
          text = ''.join((root/('.github/accretion-transfer-%d.b64'%i)).read_text() for i in range(1,6))
          assert len(text) == 51388
          compressed = base64.b64decode(text, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'b7210b7adc0478b8e926901e31e4d09589ee14d7f95508aa7b851a948af2ec23'
          decoder = lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw = decoder.decompress(compressed, max_length=2*1024*1024)
          assert decoder.eof and not decoder.unused_data
          entries = json.loads(raw)
          assert len(entries) == 35
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          seen = set()
          outputs = []
          fixed = {'SKILL_DEVELOPMENT.md','NATIVE_API_COMPATIBILITY.md','Documentation/ACCRETION_COOP_IMPLEMENTATION.md','.github/workflows/portable-network-checks.yml'}
          for entry in entries:
              name = entry['path']
              path = pathlib.PurePosixPath(name)
              assert name not in seen and not path.is_absolute() and '..' not in path.parts
              assert name in fixed or (name.startswith('Assets/Leviathan/Content/Scripts/') and path.suffix in {'.cs','.meta','.md','.ps1','.py'})
              seen.add(name)
              target = root/name
              assert target.resolve().is_relative_to(root) and not target.is_symlink()
              before = target.read_bytes() if target.exists() else b''
              assert (blob(before) if target.exists() else None) == entry['before'], 'Changed preimage: '+name
              if 'replace' in entry:
                  after = entry['replace'].encode('utf-8')
              else:
                  lines = before.decode('utf-8').splitlines(keepends=True)
                  last = 0
                  for edit in entry['edits']:
                      assert last <= edit['start'] <= edit['end'] <= len(lines)
                      last = edit['end']
                  for edit in reversed(entry['edits']):
                      lines[edit['start']:edit['end']] = [edit['text']]
                  after = ''.join(lines).encode('utf-8')
              assert blob(after) == entry['after'], 'Postimage mismatch: '+name
              # Workflow changes are made separately through the authorized GitHub connector.
              if not name.startswith('.github/'):
                  outputs.append((name, after))
          for name, data in outputs:
              target = root/name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          manifest = pathlib.Path(os.environ['RUNNER_TEMP'])/'accretion-source-files.json'
          manifest.write_text(json.dumps([name for name,_ in outputs]))
          print('Verified and materialized',len(outputs),'readable source files; unrelated files untouched.')
      - name: Execute production protocol and existing portable regressions
        run: python Assets/Leviathan/Content/Scripts/Tests/run-portable-tests.py --output "${{ runner.temp }}/portable-results"
      - name: Commit tested source to this work branch only
        shell: python
        run: |
          import json, os, pathlib, subprocess
          branch = 'codex/orrery-accretion-coop'
          current = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert current == os.environ['GITHUB_SHA']
          remote = subprocess.check_output(['git','ls-remote','origin','refs/heads/'+branch], text=True).split()[0]
          assert remote == current, 'Branch moved; refusing to overwrite other work.'
          paths = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'accretion-source-files.json').read_text())
          for i in range(1,6):
              name = '.github/accretion-transfer-%d.b64'%i
              pathlib.Path(name).unlink()
              paths.append(name)
          subprocess.run(['git','diff','--check'], check=True)
          subprocess.run(['git','add','--']+paths, check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','commit','-m','fix: prepare Accretion Disk recipient authority and swept capture for co-op playtests'], check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch], check=True)
          print('SOURCE_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
      - name: Retain exact source and test evidence without game binaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accretion-source-checkpoint
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/portable-results/*.log
            Assets/Leviathan/Content/Scripts/**
            Assets/**/SS_*.cs
            Assets/**/*.asmdef
            SKILL_DEVELOPMENT.md
            NATIVE_API_COMPATIBILITY.md
            Documentation/ACCRETION_COOP_IMPLEMENTATION.md
            Packages/manifest.json
            ProjectSettings/ProjectVersion.txt

name: Apply RouteDamage API migration

on:
  push:
    branches: [skill-trees]
    paths:
      - .github/workflows/apply-routedamage-int-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate RouteDamage bool crit boundary to int
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              "Assets/Leviathan/Content/Scripts/Leviathan/LeviathanPredator.cs": [
                  ("Damageable.DamageData[] packet, float status, bool crit, Vector2 position,",
                   "Damageable.DamageData[] packet, float status, int crit, Vector2 position,", 1),
                  ("NativeDamageable, typeof(Damageable.DamageType), typeof(Damageable.DamageData[]),\n            typeof(float), typeof(bool), typeof(Vector2), typeof(GameShip), typeof(bool),",
                   "NativeDamageable, typeof(Damageable.DamageType), typeof(Damageable.DamageData[]),\n            typeof(float), typeof(int), typeof(Vector2), typeof(GameShip), typeof(bool),", 1),
                  ("Mathf.Max(0f, source.StatusEffectChance + stats.StatusChanceBonus), crit,\n                point, owner, bypass, 0f, source, 0f, 0f, false, 0f);",
                   "Mathf.Max(0f, source.StatusEffectChance + stats.StatusChanceBonus), crit ? 1 : 0,\n                point, owner, bypass, 0f, source, 0f, 0f, false, 0f);", 1),
              ],
              "Assets/Leviathan/Content/Scripts/Orrery/OrreryDamageRouter.cs": [
                  ("Damageable.DamageData[] damageData,\n        float statusEffectChance,\n        bool crit,\n        Vector2 fromPosition,\n        GameShip fromShip,",
                   "Damageable.DamageData[] damageData,\n        float statusEffectChance,\n        int crit,\n        Vector2 fromPosition,\n        GameShip fromShip,", 1),
                  ("damageData,\n                statusEffectChance,\n                crit,\n                fromPosition,\n                owner,",
                   "damageData,\n                statusEffectChance,\n                crit ? 1 : 0,\n                fromPosition,\n                owner,", 1),
                  ("parameters[1].ParameterType != typeof(Damageable.DamageType) ||\n                parameters[2].ParameterType != typeof(Damageable.DamageData[]))",
                   "parameters[1].ParameterType != typeof(Damageable.DamageType) ||\n                parameters[2].ParameterType != typeof(Damageable.DamageData[]) ||\n                parameters[4].ParameterType != typeof(int))", 1),
              ],
              "Assets/Leviathan/Content/Scripts/Leviathan/LeviathanStarfire.cs": [
                  ("methods[i].Name == \"RouteDamage\" &&\n                parameters.Length == 14 &&\n                parameters[2].ParameterType == typeof(DamageData[]))",
                   "methods[i].Name == \"RouteDamage\" &&\n                parameters.Length == 14 &&\n                parameters[2].ParameterType == typeof(DamageData[]) &&\n                parameters[4].ParameterType == typeof(int))", 1),
                  ("args[3] = statusChance;\n        args[4] = crit;\n        args[5] = hitPoint;",
                   "args[3] = statusChance;\n        args[4] = crit ? 1 : 0;\n        args[5] = hitPoint;", 1),
              ],
              "Assets/Leviathan/Content/Scripts/Leviathan/LeviathanConstrictor.cs": [
                  ("m.Name == \"RouteDamage\" &&\n                     m.GetParameters().Length == 14 &&\n                     m.GetParameters()[2].ParameterType ==\n                        typeof(Damageable.DamageData[])\n            );",
                   "m.Name == \"RouteDamage\" &&\n                     m.GetParameters().Length == 14 &&\n                     m.GetParameters()[2].ParameterType ==\n                        typeof(Damageable.DamageData[]) &&\n                     m.GetParameters()[4].ParameterType == typeof(int)\n            );", 1),
                  ("damageData,\n                statusEffectChance,\n                crit,\n                fromPosition,\n                fromShip,",
                   "damageData,\n                statusEffectChance,\n                crit ? 1 : 0,\n                fromPosition,\n                fromShip,", 1),
              ],
              "Assets/Leviathan/Content/Scripts/Leviathan/LeviathanStellarConverter.cs": [
                  ("m.Name == \"RouteDamage\" &&\n                m.GetParameters().Length == 14 &&\n                m.GetParameters()[2].ParameterType == typeof(DamageData[]))",
                   "m.Name == \"RouteDamage\" &&\n                m.GetParameters().Length == 14 &&\n                m.GetParameters()[2].ParameterType == typeof(DamageData[]) &&\n                m.GetParameters()[4].ParameterType == typeof(int))", 2),
                  ("damage,\n                statusChance,\n                crit,\n                hitPosition,\n                owner,",
                   "damage,\n                statusChance,\n                crit ? 1 : 0,\n                hitPosition,\n                owner,", 1),
              ],
              "Assets/Leviathan/Content/Scripts/CoreCombat.cs": [
                  ("if (p.Length == 14 &&\n                p[2].ParameterType == typeof(Damageable.DamageData[]))",
                   "if (p.Length == 14 &&\n                p[2].ParameterType == typeof(Damageable.DamageData[]) &&\n                p[4].ParameterType == typeof(int))", 1),
              ],
          }

          for rel, edits in replacements.items():
              path = Path(rel)
              text = path.read_text(encoding="utf-8-sig")
              original = text
              for old, new, expected in edits:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f"{rel}: expected {expected} occurrence(s), found {actual}; refusing to guess")
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f"{rel}: no changes produced")
              path.write_text(text, encoding="utf-8")
              print("patched", rel)

          note = Path("NATIVE_API_COMPATIBILITY.md")
          note.write_text("""# Native API compatibility note\n\nOn 2026-09-13 Star Vortex changed `NetCombat.RouteDamage` parameter 5 (critical hit) from `bool` to `int`, while this Unity project still had an older game reference. Predator's exact delegate lookup therefore returned null during static initialization and prevented the mod/classes from finishing startup. Other reflected damage callers would have failed when used.\n\nCurrent rule: after a Star Vortex update, verify native reflection/delegate bindings against the **installed game's current Assembly-CSharp**, not only the Unity/editor reference. RouteDamage callers should validate the full overload signature. Existing binary crit decisions cross the current native boundary as `0` / `1`.\n\nThe 2026-09-13 migration updated Predator, OrreryDamageRouter, Starfire, Constrictor, Stellar Converter, and CoreCombat's RouteDamage selector.\n""", encoding="utf-8")
          PY

      - name: Remove one-shot workflow and commit migration
        shell: bash
        run: |
          rm -f .github/workflows/apply-routedamage-int-migration.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: migrate RouteDamage critical flag to int"
          git push origin HEAD:skill-trees
